<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Collage 25</title><script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto;background:#f5f6f8;color:#111}.wrap{max-width:1100px;margin:auto;padding:24px 14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.top h1{margin:0;font-size:clamp(28px,5vw,44px)}.muted{color:#667085}.pill{background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:8px 12px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;box-shadow:0 8px 30px #00000008}.drop{border:2px dashed #cbd5e1;border-radius:16px;padding:28px;text-align:center;background:#fafafa}.drop.drag{background:#eef2ff;border-color:#111827}button,label.btn,select,input{font:inherit}button,.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.btn{display:inline-block;background:#111827;color:white}.secondary{background:#eef2f6;color:#111827}.danger{background:#fff1f2;color:#9f1239}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}input[type=file]{display:none}.count{display:flex;justify-content:space-between;margin:16px 0 10px;font-size:14px}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:#eee}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;left:5px;top:5px;color:#fff;background:#000a;border-radius:99px;padding:2px 6px;font-size:10px}.thumb button{position:absolute;right:4px;top:4px;width:24px;height:24px;padding:0;border-radius:50%;background:#fffa}.empty{text-align:center;color:#667085;padding:28px 8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%}.swatches{display:flex;gap:8px;flex-wrap:wrap}.sw{width:32px;height:32px;border-radius:9px;border:2px solid white;box-shadow:0 0 0 1px #ddd;cursor:pointer}.active{box-shadow:0 0 0 2px #111}.preview{background:#e5e7eb;border-radius:14px;padding:12px;display:flex;justify-content:center;overflow:auto}.preview canvas{max-width:100%;height:auto;background:#fff;border-radius:10px}.note{margin-top:10px;font-size:12px;color:#667085}@media(max-width:800px){.grid{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(5,1fr)}}@media(max-width:500px){.thumbs{grid-template-columns:repeat(4,1fr)}.row{grid-template-columns:1fr}.top{flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>Photo Collage 25</h1><div class="muted">Kolase hingga 25 foto dari penyimpanan device.</div></div><div class="pill">🔒 Diproses lokal di browser</div></div><div class="grid"><section class="card"><div id="drop" class="drop"><b>Tambah foto</b><div class="muted">Klik tombol atau drag & drop.</div><label class="btn" for="files" style="margin-top:10px">Pilih Foto</label><input id="files" type="file" multiple accept="image/*,.heic,.heif"></div><div class="note">Dukungan JPG/JPEG, PNG, WebP, GIF, HEIC/HEIF dan format gambar umum.</div><div class="count"><span>Foto</span><b id="count">0 / 25</b></div><div id="thumbs" class="thumbs"></div><div id="empty" class="empty">Belum ada foto.</div><div class="actions"><button id="reset" class="secondary">Reset</button><button id="png" class="secondary" disabled>Unduh PNG</button><button id="jpg" class="btn" disabled>Unduh JPG</button></div></section><section class="card"><div class="field"><label>Layout</label><select id="layout"><option value="auto">Otomatis</option><option value="square">Kotak</option><option value="wide">Landscape</option><option value="tall">Portrait</option><option value="grid2">Grid 2 kolom</option><option value="grid3">Grid 3 kolom</option><option value="grid4">Grid 4 kolom</option></select></div><div class="row"><div class="field"><label><span>Jarak</span><span id="gapv">12</span></label><input id="gap" type="range" min="0" max="30" value="12"></div><div class="field"><label><span>Sudut</span><span id="rv">12</span></label><input id="rad" type="range" min="0" max="30" value="12"></div></div><div class="field"><label>Isi foto</label><select id="fit"><option value="contain">Fit — tanpa crop</option><option value="cover">Fill — crop</option></select></div><div class="field"><label>Background</label><div id="swatches" class="swatches"></div></div><div class="preview"><canvas id="c" width="1000" height="800"></canvas></div></section></div></div><script>const MAX=25,s={p:[],gap:12,rad:12,fit:'contain',bg:'#fff',layout:'auto'},$=x=>document.getElementById(x),c=$('c'),x=c.getContext('2d');const bg=[['#fff','Putih'],['#111827','Hitam'],['#f3f4f6','Abu'],['#fef3c7','Krem'],['#dbeafe','Biru'],['#fce7f3','Pink']];async function toImg(f){let b=f;if(/\.(heic|heif)$/i.test(f.name)||/image\/hei/.test(f.type)){b=await heic2any({blob:f,toType:'image/jpeg',quality:.92});if(Array.isArray(b))b=b[0]}let u=URL.createObjectURL(b),im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=u});return{im,u,name:f.name}}async function add(fs){for(const f of [...fs].slice(0,MAX-s.p.length)){try{s.p.push(await toImg(f))}catch(e){}}render();draw()}$('files').onchange=e=>{add(e.target.files);e.target.value=''};$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=>$('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');add(e.dataTransfer.files)};function render(){let t=$('thumbs');t.innerHTML='';s.p.forEach((p,i)=>{let d=document.createElement('div');d.className='thumb';d.innerHTML=`<img src="${p.u}"><span>${i+1}</span><button>×</button>`;d.querySelector('button').onclick=()=>{URL.revokeObjectURL(p.u);s.p.splice(i,1);render();draw()};t.appendChild(d)});$('empty').style.display=s.p.length?'none':'block';$('count').textContent=s.p.length+' / 25';$('png').disabled=$('jpg').disabled=!s.p.length}function dims(n){if(!n)return[1,1];let q;if(s.layout==='grid2')q=2;else if(s.layout==='grid3')q=3;else if(s.layout==='grid4')q=4;else if(s.layout==='wide')q=Math.ceil(Math.sqrt(n*1.6));else if(s.layout==='tall')q=Math.max(1,Math.ceil(Math.sqrt(n/1.6)));else q=Math.ceil(Math.sqrt(n));return[q,Math.ceil(n/q)]}function rr(a,b,w,h,r){x.beginPath();r=Math.min(r,w/2,h/2);x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}function fit(im,a,b,w,h){let iw=im.naturalWidth,ih=im.naturalHeight,ar=iw/ih,tr=w/h,dw=w,dh=h,dx=a,dy=b;if(s.fit==='cover'){if(ar>tr){dh=h;dw=h*ar;dx=a+(w-dw)/2}else{dw=w;dh=w/ar;dy=b+(h-dh)/2}}else{if(ar>tr){dw=w;dh=w/ar;dy=b+(h-dh)/2}else{dh=h;dw=h*ar;dx=a+(w-dw)/2}}x.drawImage(im,dx,dy,dw,dh)}function draw(){let n=s.p.length;if(!n){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);return}let [co,ro]=dims(n),g=s.gap,W=1000,H=Math.max(650,Math.round(W*ro/co)),cw=(W-g*(co+1))/co,ch=(H-g*(ro+1))/ro;c.width=W;c.height=H;x.fillStyle=s.bg;x.fillRect(0,0,W,H);s.p.forEach((p,i)=>{let X=g+(i%co)*(cw+g),Y=g+Math.floor(i/co)*(ch+g);x.save();rr(X,Y,cw,ch,s.rad);x.clip();x.fillStyle='#e5e7eb';x.fillRect(X,Y,cw,ch);fit(p.im,X,Y,cw,ch);x.restore()})}$('layout').onchange=e=>{s.layout=e.target.value;draw()};$('gap').oninput=e=>{s.gap=+e.target.value;$('gapv').textContent=e.target.value;draw()};$('rad').oninput=e=>{s.rad=+e.target.value;$('rv').textContent=e.target.value;draw()};$('fit').onchange=e=>{s.fit=e.target.value;draw()};bg.forEach(([col,name],i)=>{let b=document.createElement('button');b.className='sw'+(i?'':' active');b.style.background=col;b.title=name;b.onclick=()=>{s.bg=col;document.querySelectorAll('.sw').forEach(z=>z.classList.remove('active'));b.classList.add('active');draw()};$('swatches').appendChild(b)});$('reset').onclick=()=>{s.p.forEach(p=>URL.revokeObjectURL(p.u));s.p=[];render();draw()};function dl(type){let a=document.createElement('a');a.download='photo-collage-25.'+(type==='image/png'?'png':'jpg');a.href=c.toDataURL(type,.94);a.click()}$('png').onclick=()=>dl('image/png');$('jpg').onclick=()=>dl('image/jpeg');render();draw();</script></body></html>
